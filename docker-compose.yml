services:
  upstream:
    build: .
    image: artifact-breaker-gateway:local
    command:
      - python
      - -m
      - uvicorn
      - upstream:app
      - --host
      - 0.0.0.0
      - --port
      - "9000"
    environment:
      ARTIFACT_DIR: /srv/artifacts
      # The example directory itself processes at most 2 queries at a time;
      # overflow is answered immediately with 503 directory_busy.
      UPSTREAM_MAX_INFLIGHT: "2"
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/healthz')"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  gateway:
    build: .
    image: artifact-breaker-gateway:local
    command:
      - python
      - -m
      - uvicorn
      - app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
    environment:
      GATEWAY_DB: /data/breaker.db
      UPSTREAM_URL: http://upstream:9000
      REQUEST_TIMEOUT: "1.0"
      COOLDOWN: "2.0"
      FAILURE_THRESHOLD: "3"
      # Shared capacity across both workers: 2 in-flight seats total, at most
      # one of them usable by ordinary queries (one seat reserved for
      # emergency rollback lookups).
      GATEWAY_MAX_INFLIGHT: "2"
      GATEWAY_NORMAL_MAX_INFLIGHT: "1"
    ports:
      - "8000:8000"
    volumes:
      - breaker-data:/data
    depends_on:
      upstream:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

volumes:
  breaker-data:
